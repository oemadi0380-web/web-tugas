<!DOCTYPE html>
<html lang="id" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Task & Timeline Hub</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js untuk reaktivitas SPA -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Cegah flash semua view sebelum Alpine selesai inisialisasi */
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="h-full font-sans antialiased text-slate-800" x-data="taskApp()">

    <div class="flex h-screen overflow-hidden">

        <!-- ==================== SIDEBAR ==================== -->
        <aside class="w-64 bg-slate-900 text-slate-300 hidden md:flex flex-col shadow-xl">
            <div class="flex items-center px-6 py-6 border-b border-slate-800 space-x-3">
                <div class="bg-indigo-600 text-white p-2.5 rounded-2xl flex items-center justify-center font-bold shadow-lg shadow-indigo-600/30">
                    <i class="fa-solid fa-list-check text-lg"></i>
                </div>
                <div>
                    <h1 class="text-base font-bold text-white tracking-wide">TaskSphere</h1>
                    <p class="text-xs text-slate-400">Student Timeline Hub</p>
                </div>
            </div>

            <nav class="flex-1 px-4 py-6 space-y-1">
                <button @click="currentTab = 'timeline'" :class="currentTab === 'timeline' ? 'bg-indigo-600 text-white shadow-md shadow-indigo-600/20' : 'hover:bg-slate-800 hover:text-white'" class="w-full flex items-center px-4 py-3 text-sm font-medium rounded-2xl transition-colors">
                    <i class="fa-solid fa-timeline w-6"></i> Timeline Agenda
                </button>
                <button @click="currentTab = 'kanban'" :class="currentTab === 'kanban' ? 'bg-indigo-600 text-white shadow-md shadow-indigo-600/20' : 'hover:bg-slate-800 hover:text-white'" class="w-full flex items-center px-4 py-3 text-sm font-medium rounded-2xl transition-colors">
                    <i class="fa-solid fa-columns w-6"></i> Kanban Board
                </button>
                <button @click="currentTab = 'vault'" :class="currentTab === 'vault' ? 'bg-indigo-600 text-white shadow-md shadow-indigo-600/20' : 'hover:bg-slate-800 hover:text-white'" class="w-full flex items-center px-4 py-3 text-sm font-medium rounded-2xl transition-colors">
                    <i class="fa-solid fa-folder-open w-6"></i> Link & Resource Vault
                </button>
            </nav>

            <div class="p-4 border-t border-slate-800">
                <div class="p-3 bg-slate-800/50 rounded-2xl border border-slate-700/50 flex items-center justify-between">
                    <div>
                        <p class="text-xs font-semibold text-white">Local Storage</p>
                        <p class="text-[10px] text-emerald-400">Data tersimpan otomatis</p>
                    </div>
                    <button @click="exportData()" title="Backup JSON" class="p-2 bg-slate-700 hover:bg-slate-600 text-white rounded-xl text-xs transition">
                        <i class="fa-solid fa-download"></i>
                    </button>
                </div>
            </div>
        </aside>

        <!-- ==================== MAIN CONTENT AREA ==================== -->
        <div class="flex-1 flex flex-col min-w-0 overflow-hidden bg-slate-50">

            <!-- Top Navbar -->
            <header class="bg-white border-b border-slate-200 h-16 flex items-center justify-between px-6 z-10">
                <div class="flex items-center space-x-3">
                    <span class="md:hidden text-indigo-600 text-xl font-bold"><i class="fa-solid fa-list-check"></i></span>
                    <h2 class="text-base font-bold text-slate-800 capitalize" x-text="currentTab === 'timeline' ? 'Timeline Agenda & Deadline' : (currentTab === 'kanban' ? 'Kanban Status Pengerjaan' : 'Arsip Link Penting')"></h2>
                </div>

                <div class="flex items-center space-x-3">
                    <!-- Tombol Tambah Tugas Utama -->
                    <button @click="openModal()" class="flex items-center gap-2 px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold rounded-2xl shadow-md shadow-indigo-600/20 transition">
                        <i class="fa-solid fa-plus"></i> <span>Tambah Tugas</span>
                    </button>
                </div>
            </header>

            <!-- Scrollable Body: isi tiap view disuntikkan oleh file di folder views/ -->
            <main class="flex-1 overflow-y-auto p-6 lg:p-8">
                <div id="view-timeline" x-cloak></div>
                <div id="view-kanban" x-cloak></div>
                <div id="view-vault" x-cloak></div>
            </main>
        </div>
    </div>

    <!-- ================= HOST MODAL (diisi oleh views/modal.js) ================= -->
    <div id="view-modal"></div>

    <!-- ================= VIEWS ================= -->
    <!-- Dimuat sebagai script biasa (bukan defer) agar markup tersuntik
         SEBELUM Alpine.js (defer) melakukan inisialisasi. -->
    <script src="views/timeline.js"></script>
    <script src="views/kanban.js"></script>
    <script src="views/vault.js"></script>
    <script src="views/modal.js"></script>

    <!-- ================= APP LOGIC ================= -->
    <script src="js/app.js"></script>
</body>
</html>
